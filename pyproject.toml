[project]
name = "shopsmart-sales-dashboard"
version = "0.1.0"
description = "ShopSmart e-commerce sales analytics dashboard"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28",
    "plotly>=5.0",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
